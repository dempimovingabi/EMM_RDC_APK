<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a6e2c" />
  <title>Hors ligne — EMM RDC</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a6e2c;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .box {
      max-width: 420px;
      background: rgba(0, 0, 0, 0.22);
      padding: 28px 22px;
      border-radius: 14px;
    }
    button {
      margin-top: 16px;
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      background: #ffffff;
      color: #0a6e2c;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Connexion indisponible</h2>
    <p>Vous êtes actuellement hors ligne. Reconnectez-vous ou rouvrez l'application EMM RDC pour travailler sur vos données locales.</p>
    <button type="button" onclick="window.location.reload()">Réessayer</button>
  </div>
</body>
</html>
