<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#0a6e2c" />
  <title>EMM RD CONGO — Église Messianique Mondiale</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./css/main.css" />
</head>
<body>
  <script>
    (function () {
      function showBootError(title, message, file, line, targetUrl) {
        var box = document.getElementById('emm-boot-error');
        if (!box) {
          box = document.createElement('div');
          box.id = 'emm-boot-error';
          box.style.cssText =
            'position:fixed;inset:0;z-index:99999;background:#ffffff;color:#991b1b;padding:18px;font-family:monospace;font-size:12px;overflow:auto;word-break:break-all;white-space:pre-wrap;';
          document.body.appendChild(box);
        }
        box.innerHTML +=
          '<div style="margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #fecaca;">' +
          '<strong>' + title + '</strong>\n' +
          'Message : ' + (message || 'Échec de chargement') + '\n' +
          (targetUrl ? 'Ressource complète : ' + targetUrl + '\n' : '') +
          (file ? 'Fichier : ' + file + ' (ligne ' + (line || '?') + ')\n' : '') +
          '</div>';
      }

      window.addEventListener(
        'error',
        function (e) {
          var target = e.target;
          var url = '';
          if (target && target !== window) {
            url = target.currentSrc || target.src || target.href || '';
          }
          showBootError(
            'ERREUR SCRIPT / RESSOURCE',
            e.message || 'Échec de chargement',
            e.filename || '',
            e.lineno || '?',
            url
          );
        },
        true
      );

      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        showBootError('ERREUR ASYNCHRONE', r && r.message ? r.message : String(r || 'Erreur'), '', '', '');
      });
    })();
  </script>

  <div id="splash-screen" class="splash-screen">
    <div class="splash-logo-wrap">
      <img
        src="./assets/icons/logo.png"
        alt="EMM RDC"
        class="splash-logo"
        onerror="this.style.display='none';document.getElementById('splash-fallback-emblem').style.display='flex';"
      />
      <div id="splash-fallback-emblem" class="splash-fallback-emblem" style="display:none;">EMM</div>
    </div>
    <h1 class="splash-title">ÉGLISE MESSIANIQUE MONDIALE</h1>
    <p class="splash-subtitle">République Démocratique du Congo • EMM RDC</p>
  </div>

  <div id="offline-banner" class="offline-banner hidden">
    Mode hors ligne actif — enregistrement local automatique (synchronisation dès le retour réseau).
  </div>

  <header id="app-header" class="app-header hidden"></header>

  <main id="app-main" class="app-main">
    <div id="container" class="app-container"></div>
  </main>

  <nav id="bottom-nav" class="bottom-nav hidden"></nav>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-container"></div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
